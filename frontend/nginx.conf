server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Photo search accepts uploads up to 5 MB; nginx's default limit is 1 MB.
    client_max_body_size 6m;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json image/svg+xml;

    # The assistant streams Server-Sent Events: never buffer them.
    location /api/ai/assistant/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /static/ {
        proxy_pass http://backend:8000;
    }

    # Single-page app: unknown paths fall back to index.html for client-side routing.
    location / {
        try_files $uri /index.html;
    }
}
