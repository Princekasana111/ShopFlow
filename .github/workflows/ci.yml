name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: shopflow
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit and integration tests (offline LLM, hash embeddings)
        run: pytest --create-db
      - uses: actions/cache@v4
        with:
          path: backend/.cache/fastembed
          key: fastembed-bge-small-en-v1.5-clip-vit-b-32
      - name: Build indexes with the real embedding model
        run: python manage.py migrate --noinput && python manage.py bootstrap
      - name: Retrieval eval gate (fails the build if search quality regresses)
        run: >-
          python manage.py run_evals --suite search
          --fail-under search:hybrid.recall@5=0.95
          --fail-under search:hybrid.mrr@10=0.90

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
